<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Food Paradise</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial, sans-serif;
}

body{
    background:linear-gradient(135deg,#ff9966,#ff5e62);
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
}

.container{
    background:white;
    padding:40px;
    border-radius:15px;
    text-align:center;
    width:70%;
    max-width:800px;
    border:4px solid #ff6600;
    box-shadow:0 8px 20px rgba(0,0,0,0.2);
}

h1{
    color:#ff6600;
    margin-bottom:15px;
}

p{
    color:#555;
    line-height:1.6;
    margin-bottom:20px;
}

.features{
    display:flex;
    justify-content:space-around;
    margin-top:25px;
    flex-wrap:wrap;
}

.feature{
    background:#fff3e0;
    border:2px solid #ffb74d;
    border-radius:10px;
    padding:15px;
    margin:10px;
    width:180px;
}

.feature h3{
    color:#e65100;
    margin-bottom:10px;
}

.btn{
    display:inline-block;
    margin-top:20px;
    padding:12px 25px;
    background:#ff6600;
    color:white;
    text-decoration:none;
    border-radius:5px;
    transition:0.3s;
}

.btn:hover{
    background:#e65100;
}
</style>
</head>

<body>

<div class="container">

    <h1>🍔 Food Paradise</h1>

    <p>
        Welcome to Food Paradise. Discover delicious meals,
        exciting offers, and freshly prepared dishes delivered
        right to your doorstep.
    </p>

    <div class="features">

        <div class="feature">
            <h3>🍕 Pizza</h3>
            <p>Cheesy and hot specials.</p>
        </div>

        <div class="feature">
            <h3>🍔 Burger</h3>
            <p>Loaded with fresh ingredients.</p>
        </div>

        <div class="feature">
            <h3>🍗 Meals</h3>
            <p>Tasty combos for everyone.</p>
        </div>

    </div>

    <a href="#" class="btn">Order Now</a>

</div>

</body>
</html>
